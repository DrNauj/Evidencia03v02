{% extends "processor/base.html" %}
{% load crispy_forms_tags %}

{% block content %}
<div class="container mt-4">
    <nav aria-label="breadcrumb">
        <ol class="breadcrumb">
            <li class="breadcrumb-item"><a href="{% url 'processor:job_list' %}">Jobs</a></li>
            <li class="breadcrumb-item active">Nuevo Job</li>
        </ol>
    </nav>

    <div class="card">
        <div class="card-header">
            <h3 class="card-title mb-0">Crear Nuevo Job</h3>
        </div>
        <div class="card-body">
            <form method="post">
                {% csrf_token %}
                {{ form|crispy }}
                <div class="mt-3">
                    <button type="submit" class="btn btn-primary">Crear Job</button>
                    <a href="{% url 'processor:job_list' %}" class="btn btn-secondary">Cancelar</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
